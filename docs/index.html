// ---------- live traffic overlay (TomTom raster flow tiles) ----------
// Style "relative-delay" paints ONLY segments moving slower than free
// flow, so the risk choropleth underneath stays legible statewide.
// Tiles live in a custom pane above the county fills (overlayPane=400)
// but below markers/tooltips (600+); pointer events pass through so
// county hover/click still work. Layer is skipped when no key was
// present at build time. redraw() every 5 min pulls fresh tiles
// (TomTom re-renders them every minute).
let trafficLayer=null;
if(D.tt){
  map.createPane('traffic');
  map.getPane('traffic').style.zIndex=450;
  map.getPane('traffic').style.pointerEvents='none';
  trafficLayer=L.tileLayer(
    'https://api.tomtom.com/traffic/map/4/tile/flow/relative-delay/{z}/{x}/{y}.png?key='+D.tt+'&thickness=10',
    {pane:'traffic',opacity:0.9,maxZoom:22,attribution:'live traffic &copy; TomTom'}).addTo(map);
  setInterval(()=>{ if(map.hasLayer(trafficLayer)) trafficLayer.redraw(); },300000);

const byFips = {};
Object.entries(D.counties).forEach(([name,c])=>{ c.name=name; if(c.fips) byFips[c.fips]=c; });

// Continuous, power-scaled ramp: opportunity is very top-heavy, so a
// linear scale flattens most counties into one shade. t = (r/100)^0.35
// spreads the low end — risk 1, 3, and 8 get visibly different fills.
const RAMP=[[0,[255,243,238]],[0.25,[252,187,161]],[0.5,[251,106,74]],[0.75,[203,24,29]],[1,[103,0,13]]];
function color(r){
  const t=Math.pow(Math.min(Math.max(r,0),100)/100,0.35);
  for(let i=1;i<RAMP.length;i++){
    if(t<=RAMP[i][0]){
      const [t0,c0]=RAMP[i-1],[t1,c1]=RAMP[i],f=(t-t0)/(t1-t0);
      return 'rgb('+c0.map((v,k)=>Math.round(v+(c1[k]-v)*f)).join(',')+')';
    }
  }
  return 'rgb(103,0,13)';
}
// Incident heat flush: blend the fill toward hot red in proportion to the
// county's incident boost. One live crash (boost x1.10) is a clearly
// visible warm shift even on a pale county; it fades back over ~2 days
// exactly as the trailing weight decays the boost toward x1.00.
function fillFor(c){
  const k=Math.min(1,Math.max(0,(c.incBoost-1)/0.3));
  if(k<=0.01) return color(c.risk);
  const m=color(c.risk).match(/\d+/g).map(Number);
  const hot=[225,25,0];
  const f=0.5*k;
  return 'rgb('+m.map((v,i)=>Math.round(v+(hot[i]-v)*f)).join(',')+')';
}

// ---------- side panel ----------
function sec(title, body){ return `<div class="sec"><h3>${title}</h3><div>${body}</div></div>`; }
function panelHTML(c,name){
  let h = `<h2>${name} County <span class="badge" style="background:${color(c.risk)}">risk ${c.risk.toFixed(1)}</span></h2>`;
  h += `<div style="color:#777;font-size:12.5px">${c.metro==='other_in'?'outside core metros':c.metro+' market'} · next ${D.hours}h</div>`;
  h += sec('Why this county scores here',
    `#${c.rank} statewide in EMS-measured crash injuries — ${Math.round(c.injured).toLocaleString()} injured patients/yr, ${Math.round(c.serious)} serious cases.`);
  if(c.dynamic){
    h += sec('Weather (next '+D.hours+'h)',
      `${c.wx}. Overall risk lift <b>×${c.lift.toFixed(2)}</b>${c.peak?`; peak-risk window <b>${c.peak}</b>`:''}.`);
  } else {
    h += sec('Weather', '<i>Weather feed did not reach this county this run — using neutral baseline.</i>');
  }
  let inc='';
  const f=countyFactors(name), crashes=f['crash']||0;
  if(crashes) inc += `<b>⚠ ${crashes} active crash${crashes>1?'es':''}</b> — marked on the map.<br>`;
  const parts=Object.entries(f).filter(([k])=>k!=='crash')
    .map(([k,v])=>`${v} ${FACTOR_LABEL[k]||k}`);
  if(parts.length) inc += `<b>Traffic factors</b> shading this county (no markers): ${parts.join(', ')}.<br>`;
  if(c.trailing>0.05) inc += `<b>Recent-incident echo</b>: weight <b>${c.trailing.toFixed(1)}</b> from significant events in the last ~2 days, fading as they age.<br>`;
  if(inc) inc += `Together these boost this county's color ×${c.incBoost.toFixed(2)} on top of its injury baseline and weather.`;
  h += sec('Live & recent traffic (feeds the color)', inc ||
    'Nothing live or recent — color here is injury baseline × weather only.');
  if(c.truckBadge){
    h += sec('Vehicle profile', `🚛 <b>Trucking-crash-prone</b> — ${c.truckBadge}.`);
  }
  if(c.learned && Math.abs(c.learned-1)>=0.005)
    h += sec('Learned county adjustment', `Official ARIES crash records (all roads, all severities) blended with every crash our own feeds record shift this county ×<b>${c.learned.toFixed(2)}</b> against its EMS-injury baseline (coverage-corrected and recentred so shifts are relative between counties; capped and shrunk toward 1.0 — the EMS baseline stays the anchor).`);
  if(c.cov){
    const g=c.cov.grade;
    let txt;
    if(g==='learning') txt='Not graded yet — the statewide crash archive is still in its learning phase.';
    else if(g==='small sample') txt=`Too few expected crashes here to grade reliably yet (${c.cov.obs} archived so far).`;
    else txt=`Grade <b>${g}</b> — our feeds captured ${c.cov.obs} of ~${c.cov.exp} crashes expected here, judged against similar-sized counties (peer capture ×${c.cov.peer||1})`+((g==='D'||g==='F')?'. <b>Quiet feeds here mean low observation, not low risk</b> — the color leans on the EMS/ARIES baseline instead.':'.');
    if(c.cov.trend) txt+=` <b>Trend: capture ${c.cov.trend}</b> vs this county's own history${c.cov.trend==='falling'?' — check for a feed change before reading it as a safety change':''}.`;
    h += sec('Feed coverage (are we seeing this county?)', txt);
  }
  if(c.flows && c.flows.origins && c.flows.origins.length){
    let rows = `<div class="origin-row"><span>local (lives in-county)</span><b>${((c.flows.internal_share||0)*100).toFixed(0)}%</b></div>`;
    const mx = Math.max(...c.flows.origins.map(o=>o.share));
    c.flows.origins.forEach(o=>{
      rows += `<div class="origin-row"><span>${o.label}</span><b>${(o.share*100).toFixed(1)}%</b></div>`+
              `<div class="bar" style="width:${(o.share/mx*100).toFixed(0)}%"></div>`;
    });
    rows += `<div style="color:#777;font-size:12px;margin-top:6px">Census commuter data — blue lines on the map show these inflows. Counties above are candidates to include in this hotspot's ad geography.</div>`;
    h += sec('Who travels through (origins)', rows);
  }
  return h;
}
function incidentPanelHTML(t){
  const age = t.age_h<48 ? `${Math.round(t.age_h)}h ago` : `${(t.age_h/24).toFixed(1)} days ago`;
  let h = `<h2>${t.truck?'🚛':'💥'} Recent ${t.truck?'truck-involved ':''}crash <span class="badge" style="background:#5e35b1">fading</span></h2>`;
  h += sec('What', `${t.type}${t.desc?`<br><span style="color:#555">${t.desc}</span>`:''}`);
  h += sec('Where / when', `${t.county} County${t.road?` · <b>${t.road}</b>`:''}${t.first?`<br>first on feed (Indiana time) ${t.first.replace('T',' ')}${t.last&&t.last!==t.first?` · last ${t.last.replace('T',' ')}`:''}`:''} · ${age}.`+
    (t.lat!=null?`<br><span style="color:#777">${t.lat.toFixed(4)}, ${t.lon.toFixed(4)}</span>`:''));
  h += sec('Current weight', `Magnitude ${t.mag}/5, decayed to <b>${t.imp.toFixed(2)}</b> (${(t.decay*100).toFixed(0)}% remaining; 48h half-life). It shrinks and fades as it ages, and leaves the map after ~4 days.`);
  return h;
}
const FACTOR_LABEL={'closure/hazard':'closures/hazards','stalled/disabled':'stalled vehicles',
 'congestion':'congestion reports','roadwork':'roadwork zones','other':'other events'};
function countyFactors(name){
  const f={};(D.live||[]).forEach(t=>{if(t.county===name)f[t.cat]=(f[t.cat]||0)+1;});

}

let flowLayer = L.layerGroup().addTo(map);
function drawFlows(c){
  flowLayer.clearLayers();
  if(!(c.flows&&c.flows.origins&&c.lat)) return;
  c.flows.origins.forEach(o=>{
    if(o.lat==null) return;
    L.polyline([[o.lat,o.lon],[c.lat,c.lon]],{color:'#08519c',weight:1+o.share*30,opacity:.65}).addTo(flowLayer);
    L.circleMarker([o.lat,o.lon],{radius:4,color:'#08519c',fillOpacity:.9}).addTo(flowLayer);

// ---------- county layer ----------
let geoLayer=null, fallbackLayer=null;
let shadeOn=true;  // 'County risk shading' toggle (borders stay for clicks)
function styleFor(c){return {color:'#555',weight:c.events>0?2.5:1,
  dashArray:c.events>0?'4':null,fillColor:fillFor(c),
  fillOpacity:shadeOn?.62:0};}
const hoverStyle={weight:3,color:'#111',fillOpacity:.8};

function wireCounty(layer,c,name){
  layer.bindTooltip(`${name} County — click for details`,{sticky:true,className:'hint',direction:'top'});
  layer.on('mouseover',()=>layer.setStyle({...hoverStyle,fillOpacity:shadeOn?.8:0}));
  layer.on('mouseout',()=>layer.setStyle(styleFor(c)));
  layer.on('click',()=>{openPanel(panelHTML(c,name)); drawFlows(c);});
}
function render(){
  if(D.features && D.features.length){
    if(geoLayer) map.removeLayer(geoLayer);
    geoLayer = L.geoJSON({type:'FeatureCollection',features:D.features},{
      style: f=>{const c=byFips[f.id]; return c?styleFor(c):{fillColor:'#eee',color:'#999',weight:.5,fillOpacity:.3};},
      onEachFeature:(f,layer)=>{ const c=byFips[f.id]; if(c) wireCounty(layer,c,c.name); }}).addTo(map);
  } else {
    if(fallbackLayer) map.removeLayer(fallbackLayer);
    fallbackLayer=L.layerGroup().addTo(map);
    Object.entries(D.counties).forEach(([name,c])=>{
      if(c.lat==null) return;
      const layer=L.circle([c.lat,c.lon],{radius:13000,...styleFor(c)}).addTo(fallbackLayer);
      wireCounty(layer,c,name);
    });
  }
}
render();

  let h=`<h2>📍 Crash hotspot <span class="badge" style="background:#e65100">${s.n} archived crashes</span></h2>`;
  h+=sec('Where',`${s.county||'?'} County${s.road?` · <b>${s.road}</b>`:''}<br><span style="color:#777">${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}</span>`);
  h+=sec('History',`Our feeds have archived <b>${s.n}</b> crashes within ~400 m of this spot${s.first?` (${s.first} → ${s.last})`:''}${s.truck?`, <b>${s.truck} truck-involved</b>`:''}. A segment earns a pin at ${D.hotspotMin}+ archived crashes within the last ${D.hotspotWindowD} days — pins age out when a spot goes quiet.`);
  if(s.rel) h+=sec('How unusual',`<b>${s.rel}×</b> the median repeat-crash ${s.cls} location statewide in the same window (relative to our own archive; not a traffic-volume-adjusted rate).`);
  h+=(``);
  return h;
}
const hotLayer = L.layerGroup().addTo(map);
(D.hotspots||[]).forEach(s=>{
  const m=L.marker([s.lat,s.lon],{icon:incIcon('hot','📍',36,1),zIndexOffset:900}).addTo(hotLayer);
  m.bindTooltip(`Hotspot: ${s.n} crashes${s.rel?` · ${s.rel}× class typical`:''}${s.road?` · ${s.road}`:''}`,{sticky:true,className:'hint',direction:'top'});
  m.on('click',()=>openPanel(hotspotPanelHTML(s)));
});

// ---------- risky corridor segments (multi-km, same window) ----------
function segmentPanelHTML(s){
  let h=`<h2>〰 Risky corridor <span class="badge" style="background:#0e7490">${s.n} crashes / ${s.km} km</span></h2>`;
  h+=sec('Where',`<b>${s.road}</b> (${s.cls}) · ${s.county} County${s.county.includes('/')?' area':''}`);
  h+=sec('Pattern',`<b>${s.n}</b> archived crashes on <b>${s.days}</b> distinct days along a <b>${s.km} km</b> stretch in the last ${D.hotspotWindowD} days — ${s.per_km}/km${s.truck?`, <b>${s.truck} truck-involved</b>`:''} (${s.first} → ${s.last}). Corridors complement 📍 hotspots: a stretch can be contentious without any single 400 m cell crossing the hotspot bar.`);
  h+=sec('Reading the line',`The line connects this corridor's actual crash locations (the pipeline has no road-geometry data), so it approximates the roadway.`);
  return h;
}
// Own pane at z=460: above county fills (overlayPane 400) and the
// TomTom traffic tiles (450), below markers (600). Without this the
// county layer — re-inserted into the shared SVG on every recolor —
// paints over the lines and buries them.
map.createPane('segments');
map.getPane('segments').style.zIndex=460;
const segLayer = L.layerGroup().addTo(map);
(D.segments||[]).forEach(s=>{
  if(!s.path || s.path.length<2) return;
  // white casing under a teal dash: cool hue reads against the red
  // choropleth and red traffic lines; the halo reads on any background
  L.polyline(s.path,{pane:'segments',color:'#fff',weight:12,opacity:.95}).addTo(segLayer);
  const pl=L.polyline(s.path,{pane:'segments',color:'#0e7490',weight:6.5,opacity:1,dashArray:'10 6'}).addTo(segLayer);
  pl.bindTooltip(`Risky corridor: ${s.road} — ${s.n} crashes / ${s.km} km`,{sticky:true,className:'hint'});
  pl.on('click',()=>openPanel(segmentPanelHTML(s)));
});

// ---------- layer toggles ----------
// Shading is a polygon STYLE, not a layer, so a placeholder overlay
// drives a flag: removing it from the control clears county fills
// (borders/click/hover stay so the map remains navigable).
const shadePlaceholder=L.layerGroup().addTo(map);
map.on('overlayadd',e=>{ if(e.layer===shadePlaceholder){shadeOn=true; render();} });
map.on('overlayremove',e=>{ if(e.layer===shadePlaceholder){shadeOn=false; render();} });
const overlays={
  'County risk shading':shadePlaceholder,
  'Live incidents ⚠':liveLayer,
  'Recent crashes 💥 (fading)':trailLayer,
  'Hotspots 📍':hotLayer,
  'Risky corridors 〰':segLayer,
  'Truck-prone counties 🚛':badgeLayer};
if(trafficLayer) overlays['Live traffic (slowdowns)']=trafficLayer;
L.control.layers(null,overlays,{position:'topleft',collapsed:true}).addTo(map);

// ---------- legend + live status ----------
const legend=L.control({position:'bottomright'});
function lgRow(sym,txt){return '<div class="lg-row"><span class="lg-sym">'+sym+'</span><span>'+txt+'</span></div>';}
legend.onAdd=()=>{const d=L.DomUtil.create('div','panel-box');
 d.id='legend';
 L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
 let rows =
  lgRow('<span style="background:linear-gradient(90deg,rgb(255,243,238),rgb(252,187,161),rgb(251,106,74),rgb(203,24,29),rgb(103,0,13));display:inline-block;width:20px;height:10px;border:1px solid #999;border-radius:2px"></span>',
        'county risk, low → high (injuries baseline × weather × traffic); a red flush = live/recent incidents, fading as they decay')+
  lgRow('<span style="color:#c62828">⚠</span>','live crash (🚛 if truck-involved)')+
  lgRow('<span style="color:#5e35b1">💥</span>','recent crash — shrinks/fades with age, gone after ~4 days')+
  lgRow('<span style="color:#e65100">📍</span>','hotspot: '+D.hotspotMin+'+ crashes within ~400 m in '+D.hotspotWindowD+' days')+
  ((D.segments&&D.segments.length)?lgRow('<span style="color:#0e7490;background:#fff;border-radius:2px;padding:0 2px">〰</span>','risky corridor: repeat crashes chained along one road for 2+ km ('+D.segments.length+' this window)'):'')+
  (D.tt?lgRow('<span style="color:#d32f2f">▬</span>','live traffic slowdowns (TomTom; toggle top-left)'):'')+
  lgRow('🚛','trucking-crash-prone county (vs statewide truck share)')+
  lgRow('👆','click any county, marker, or line for details')+
  (D.degraded?lgRow('<span style="color:#c62828">⚠</span>','<span style="color:#c62828;font-weight:700">live feeds degraded since '+D.degraded+' — colors lean on baseline</span>'):'');
 d.innerHTML =
  '<div class="lg-h" onclick="document.getElementById(\'legend\').classList.toggle(\'folded\')">'+
  '<span>Legend<span class="lg-sub"> — next '+D.hours+'h</span></span><span class="car">▼</span></div>'+
  '<div id="lg-body">'+rows+
  '<div class="lg-status">'+
  '<span id="livestatus">live weather: starting…</span><br>'+
  'last build: '+String(D.generated).replace('T',' ').slice(0,16)+' (Indiana time)<br>'+
  '<span id="incstatus">incidents: from this build</span></div></div>';
 if(window.matchMedia && window.matchMedia('(max-width:700px)').matches) d.classList.add('folded');
 return d;};
legend.addTo(map);

// ---------- LIVE MODE: refresh weather every 15 min ----------
const MULT={rl:1.25,rm:1.5,rh:1.8,sl:1.5,sm:1.8,sh:2.2,fz:2.5,fog:1.4,dark:1.25,wind:1.15};
function wmult(p,s,t,vis,g,day,code){
  let m=1;
  if([56,57,66,67].includes(code)||(p>0.1&&t<=0)) m*=MULT.fz;
  else if(s>2.5)m*=MULT.sh; else if(s>1)m*=MULT.sm; else if(s>0.1)m*=MULT.sl;
  else if(p>7.6)m*=MULT.rh; else if(p>2.5)m*=MULT.rm; else if(p>0.1)m*=MULT.rl;
  if(vis<1000)m*=MULT.fog; if(!day)m*=MULT.dark; if(g>40)m*=MULT.wind;
  return Math.min(m,3.5);
}
async function refreshWeather(){
  const names=Object.keys(D.dynamicCentroids);
  if(!names.length) return;
  const lats=names.map(n=>D.dynamicCentroids[n].lat).join(',');
  const lons=names.map(n=>D.dynamicCentroids[n].lon).join(',');
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}`+
   `&hourly=precipitation,snowfall,temperature_2m,visibility,wind_gusts_10m,is_day,weather_code`+
   `&forecast_days=${Math.min(7,Math.ceil(D.hours/24))}&timezone=America%2FIndiana%2FIndianapolis`;
  try{
    let payload=await (await fetch(url)).json();
    if(!Array.isArray(payload)) payload=[payload];
    names.forEach((name,i)=>{
      const h=payload[i].hourly; let total=0;
      for(let k=0;k<Math.min(D.hours,h.time.length);k++){
        const ts=new Date(h.time[k]);
        const ex=D.exposure[((ts.getDay()+6)%7)*24+ts.getHours()];
        total+=wmult(h.precipitation[k],h.snowfall[k],h.temperature_2m[k],
                     h.visibility[k],h.wind_gusts_10m[k],h.is_day[k],h.weather_code[k])*ex;
      }
      const c=D.counties[name];
      c.lift=total/D.hours;
    });
    recolor();
    document.getElementById('livestatus').textContent='live weather: updated '+new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById('livestatus').textContent='live weather: refresh failed (showing last data)';
  }
}
function recolor(){
  Object.values(D.counties).forEach(c=>{ c._live=c.opportunity*(c.lift||1)*D.hours*c.incBoost; });
  const mx=Math.max(...Object.values(D.counties).map(c=>c._live));
  Object.entries(D.counties).forEach(([n,c])=>{c.risk=100*c._live/mx; if(c.fips&&byFips[c.fips])byFips[c.fips].risk=c.risk;});
  render();
}
refreshWeather();
setInterval(refreshWeather, 15*60*1000);

// ---------- LIVE MODE: re-pull incidents from the newest pipeline build ----
// Same-origin fetch of live_markers.json (republished by every Actions run;
// no API keys in the page). Freshness is bounded by the pipeline cadence.
async function refreshIncidents(){
  try{
    const r=await fetch('live_markers.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const j=await r.json();
    if(!j || j.generated===D.generated) return; // same build, nothing new
    D.live=j.live||D.live;
    D.trail=j.trail||D.trail;
    Object.entries(j.counties||{}).forEach(([n,u])=>{
      const c=D.counties[n];
      if(c){c.events=u.events;c.incBoost=u.incBoost;c.trailing=u.trailing;}
    });
    D.generated=j.generated;
    drawLive(); drawTrail(); recolor();
    document.getElementById('incstatus').textContent=
      'incidents: pipeline run of '+String(j.generated).replace('T',' ').slice(0,16);
  }catch(e){/* offline / local file view — keep build-time data */}
}
setInterval(refreshIncidents, 5*60*1000);
</script></body></html>
