name: Poll incidents + publish live forecast map
# TRIGGERING: driven EXCLUSIVELY by an external pinger (cron-job.org,
# every 20 min at :00/:20/:40) hitting the workflow_dispatch API, because
# GitHub's own cron proved unreliable (dropped overnight windows, Aug 5-6).
# Do NOT re-add a schedule: trigger here — with cancel-in-progress: true a
# second trigger source doesn't act as a backup, it fires offset from the
# pinger and cancels every run mid-window (and the resulting push storm
# supersedes Pages builds, so the site stops updating; see Aug 6 incident).
on:
  workflow_dispatch:          # manual "Run workflow" button + the pinger
    inputs:
      publish_safety:
        description: "Publish the reviewed public safety drafts (Road Safety Watch + Action Brief)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: forecast
  cancel-in-progress: true    # a new window's job takes over from the old
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 21       # was 19, which killed the window's last poll
                              # mid-push; the concurrency group above (not
                              # this timeout) is what hands over windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy requests openpyxl
      - name: Full build, publish, then ~3.5-minute 511 polls until window end
        env:
          HISTORY_PATH: incident_history.json
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          SAFEROUTE_PUSH_TOKEN: ${{ secrets.SAFEROUTE_PUSH_TOKEN }}
        run: |
          set -e
          git config user.name "forecast-bot"
          git config user.email "bot@users.noreply.github.com"
          # SELF-HEALING SYNC+PUSH. The old inline `git pull --rebase || true`
          # had a failure mode that silently killed the rest of the window:
          # one rebase conflict (incident_history.json is single-line JSON,
          # so ANY concurrent edit conflicts) left the repo wedged mid-rebase
          # on a detached HEAD, and every later push failed. This function
          # (1) aborts any half-finished rebase before and after each try,
          # (2) resolves conflicts in favor of THIS run's files (-X theirs
          # during a rebase = keep our commit's content; our history is a
          # superset of what this job knew, and the newest build should own
          # docs/), and (3) retries with jittered backoff for plain races.
          sync_push() {
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              git checkout -- . 2>/dev/null || true
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
                return 0
              fi
              sleep $(( (RANDOM % 15) + 5 ))
            done
            git rebase --abort 2>/dev/null || true
            echo "WARNING: sync_push failed after retries; work is committed locally and the next cycle will retry"
            return 0
          }
          # PUBLISH STEP (manual runs only): promote the drafts that were
          # ALREADY on the site — i.e. exactly what the reviewer read —
          # to the public URLs, BEFORE the new build refreshes the drafts.
          if [ "${{ github.event.inputs.publish_safety }}" = "true" ] && [ -f docs/safety_watch_draft.html ]; then
            echo "MODE: publishing reviewed public safety pages"
            cp docs/safety_watch_draft.html docs/safety_watch.html
            cp docs/action_brief_draft.html docs/action_brief.html || true
          fi
          echo "MODE: full build"
          python run.py --hours 48
          mkdir -p docs
          touch docs/.nojekyll
          if [ -f output/risk_map.html ]; then
            cp output/risk_map.html docs/index.html
            cp output/live_markers.json docs/
            cp output/ad_ops.html docs/
            cp output/safety_watch_draft.html docs/ || true
            cp output/action_brief_draft.html docs/ || true
            cp output/risk_points.csv docs/ || true
            cp output/coverage_zones.geojson docs/ || true
            cp output/*.csv docs/
          fi
          git add incident_history.json docs/
          git diff --cached --quiet || git commit -m "forecast update $(date -u +%FT%TZ)"
          sync_push
          # SAFEROUTE DATA BRIDGE: push the freshly exported data files to
          # the saferoute-indiana repo, but ONLY when their content actually
          # changed (hotspots move slowly; avoids redeploy churn on Render).
          # Skips silently if the token secret is missing/expired or files
          # weren't produced this build.
          if [ -n "$SAFEROUTE_PUSH_TOKEN" ] && [ -f output/risk_points.csv ] && [ -f output/coverage_zones.geojson ]; then
            echo "MODE: SafeRoute data bridge"
            rm -rf /tmp/saferoute
            if git clone --depth 1 "https://x-access-token:${SAFEROUTE_PUSH_TOKEN}@github.com/danielliu12/saferoute-indiana.git" /tmp/saferoute 2>/dev/null; then
              mkdir -p /tmp/saferoute/data
              cp output/risk_points.csv /tmp/saferoute/data/
              cp output/coverage_zones.geojson /tmp/saferoute/data/
              cd /tmp/saferoute
              git config user.name "forecast-bot"
              git config user.email "bot@users.noreply.github.com"
              git add data/risk_points.csv data/coverage_zones.geojson
              if git diff --cached --quiet; then
                echo "SafeRoute data unchanged; no push"
              else
                git commit -m "SafeRoute data update $(date -u +%FT%TZ)"
                git push && echo "SafeRoute data pushed; Render will redeploy" || echo "WARNING: SafeRoute push failed (check token permissions/expiry)"
              fi
              cd "$GITHUB_WORKSPACE"
            else
              echo "WARNING: could not clone saferoute-indiana (token invalid or expired?)"
            fi
          else
            echo "SafeRoute bridge skipped (no token secret or no export files)"
          fi
          # ~3.5-min 511 polls for the rest of the window (per the measured
          # 15-min median crash listing; pending the 511 ToS review we stay
          # at this deliberately gentle cadence). COMMIT every cycle, but
          # PUSH only every second cycle + a final flush: branch-based
          # GitHub Pages rebuilds on EVERY push to main and soft-limits at
          # ~10 builds/hour — pushing each poll (plus builds) exceeded that
          # and Pages started skipping deploys (stale site, Aug 6). This
          # yields 3 pushes per 20-min window = 9 Pages builds/hour.
          START=$(date +%s)
          N=0
          while [ $(( $(date +%s) - START )) -lt 900 ]; do
            sleep 210
            N=$(( N + 1 ))
            echo "MODE: poll-only (511 -> incident history) [cycle $N]"
            python run.py --poll-only || true
            git add incident_history.json
            git diff --cached --quiet || git commit -m "incident poll $(date -u +%FT%TZ)"
            if [ $(( N % 2 )) -eq 0 ]; then sync_push; fi
          done
          # flush any unpushed poll commits before the window ends
          sync_push
